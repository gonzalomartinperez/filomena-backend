[program:octane]
directory=/app
command=/usr/local/bin/php /app/artisan octane:frankenphp --host=0.0.0.0 --port=%(ENV_APP_PORT)s --log-level=%(ENV_OCTANE_LOG_LEVEL)s %(ENV_OCTANE_EXTRA_FLAGS)s
user=root
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=3600
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100
