global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: filomena-backend
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus_bearer_token
    static_configs:
      - targets: ['frankenphp:8000']

  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
