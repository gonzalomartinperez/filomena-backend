<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc">
<title id="title">Filomena backend: historical architecture overview</title><desc id="desc">Historical Filomena backend: Next.js client sends REST JSON through Caddy and FrankenPHP with Octane to Laravel. Sanctum, Fortify and role permissions guard exam and grading workflows. MariaDB, Redis, Horizon and file storage support persistence and asynchronous work. Protected metrics feed Prometheus and Grafana; Health, Pulse and Telescope support diagnosis.</desc>
